[package]
name = "tbl"
version = "0.1.0"
edition = "2021"
authors = ["Kirby Little"]
description = "A powerful CLI tool for formatting CSV data into pretty tables"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
comfy-table = "7.1"
csv = "1.3"
anyhow = "1.0"
atty = "0.2"
serde_json = "1.0"
indexmap = "2.0"

[dev-dependencies]
tempfile = "3.8"
